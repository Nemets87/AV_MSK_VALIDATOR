name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'   # например, v1.0.0-rc1, v1.0.0-beta

permissions:
  contents: write

jobs:
  build-and-release:
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      contains(github.ref_name, '.')
    runs-on: ubuntu-latest
    steps:
      # ... остальное без изменений
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify tag matches version in pyproject.toml
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Tag version: $TAG_VERSION"
          echo "pyproject version: $PYPROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "❌ Версия в pyproject.toml ($PYPROJECT_VERSION) не совпадает с тегом ($TAG_VERSION)"
            exit 1
          fi
          echo "✅ Версии совпадают"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build

      - name: Run tests
        run: pytest --cov=av_msk_validator --cov-fail-under=80

      - name: Build package
        run: python -m build

      - name: Verify artifacts
        run: |
          ls -la dist/
          test -f dist/*.tar.gz
          test -f dist/*.whl

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -f CHANGELOG.md ]; then
            # Извлекаем блок от "## [<version>]" до следующего "## ["
            awk -v ver="$VERSION" '
              $0 ~ "^## \\["ver"\\]" { flag=1; next }
              /^## \[/ { flag=0 }
              flag { print }
            ' CHANGELOG.md > release_notes.txt
            if [ ! -s release_notes.txt ]; then
              echo "Секция для версии $VERSION не найдена в CHANGELOG.md" > release_notes.txt
            fi
          else
            echo "CHANGELOG.md отсутствует. Показаны автоматические заметки GitHub." > release_notes.txt
          fi
          echo "notes_path=release_notes.txt" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.notes_path }}
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          retention-days: 30
